    <!-- Section for the main navbar -->

    <!---------------------------->
<!-- Inicio Login -->
<form class="form" id="form">
      <div class="wrapperr">
        <div class="login_boxR">
            <div class="login-header">
                <span>Regístrate</span>
            </div>
            <form class="form form-register" id="form" novalidate>
            <div class="input-box">
                <label for="inputName" class="label">Nombre*</label>
                <input name="Name" type="text" id="inputName" class="input-fiel" autocomplete="name" placeholder="Nombre(s)">
            </div>
            <div class="inputR">
                <div>
                <label for="inputFirstSurName" class="label">Apellidos*</label>
                </div>
                <input name="FirstSurName" type="text" id="inputFirstSurName" class="Apellido1 apellidoM" required placeholder="Primer apellido">
                <input name="SecondSurName" type="text" id="inputSecondSurName" class="Apellido2" required placeholder="Segundo apellido">
            </div>
            <div class="input-box">
                <label for="inputEmail" class="label">Correo electrónico*</label>
                <input name="Email" type="text" id="inputEmail" class="input-fiel" autocomplete="email" placeholder="Correo electrónico">
            </div>
            <div class="input-box">
                <label for="inputPhone" class="label">Teléfono*</label>
                <input name="Phone" type="text" id="inputPhone" class="input-fiel" required placeholder="Teléfono (10 dígitos)">
            </div>
            <div class="input-box">
                <label for="userPass" class="label">Contraseña*</label>
                <input name="Passs" type="password" id="userPass" class="input-fiel" autocomplete="new-password" required placeholder="Debe contener de 8-20 caracteres...">
            </div>
            <div class="input-box">
                <label for="userPassconfirm" class="label">Confirma contraseña*</label>
                <input name="name="Passs2"" type="password" id="userPassconfirm" class="input-fiel" autocomplete="new-password" placeholder="Repite la contraseña">
            </div>
            <div class="alert-error">Todos los campos son obligatorios*</div>
        <button  id="submit" class="botonR">Registrase</button>
         </form>
        </div>
      </div>

      <!-- Fin del Login -->

<!------------- Footer ---------->
<footer class="text-white text-center py-3" id="general-footer"></footer>

<!-- Animaciones personalizadas -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const headers = document.querySelectorAll("h3");
        headers.forEach((header) => {
            header.addEventListener("mouseover", () => {
                header.style.transform = "scale(1.1)";
                header.style.transition = "transform 0.3s";
            });
            header.addEventListener("mouseout", () => {
                header.style.transform = "scale(1)";
            });
        });
    });
</script>
